name: Release benchmarks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-memory-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run benchmark:memory:release
